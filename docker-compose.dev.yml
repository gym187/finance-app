services:
  postgres:
    image: postgres:16-alpine
    container_name: finance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance123}
      POSTGRES_DB: ${POSTGRES_DB:-financedb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:20-alpine
    container_name: finance_backend_dev
    working_dir: /app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance123}@postgres:5432/${POSTGRES_DB:-financedb}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3001
      NODE_ENV: development
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3002}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3002}
    volumes:
      - .:/app
      - backend_modules:/app/node_modules
      - backend_app_modules:/app/apps/backend/node_modules
    ports:
      - "3001:3001"
    command: >
      sh -c "
        apk add --no-cache openssl &&
        npm install --legacy-peer-deps &&
        npx prisma generate --schema=./prisma/schema.prisma &&
        npx tsx watch apps/backend/src/index.ts
      "

  frontend:
    image: node:20-alpine
    container_name: finance_frontend_dev
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NODE_ENV: development
    volumes:
      - .:/app
      - frontend_modules:/app/node_modules
      - frontend_app_modules:/app/apps/frontend/node_modules
      - frontend_next:/app/apps/frontend/.next
    ports:
      - "3002:3000"
    command: >
      sh -c "
        npm install --legacy-peer-deps &&
        npm run dev --workspace=apps/frontend -- --port 3000
      "

volumes:
  postgres_data:
  backend_modules:
  backend_app_modules:
  frontend_modules:
  frontend_app_modules:
  frontend_next:
